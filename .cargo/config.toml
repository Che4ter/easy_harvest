[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
ar = "x86_64-w64-mingw32-ar"

# Supply-chain cooldown: ignore crate versions published in the last 3 days
# (most hijacked/malicious releases are yanked within that window).
# Override once: CARGO_RESOLVER_INCOMPATIBLE_PUBLISH_AGE=allow cargo update ...
[registry]
global-min-publish-age = "3 days"
