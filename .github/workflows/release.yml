name: Release

on:
  push:
    tags:
      - 'v*'

# Default to read-only. The upload job explicitly elevates to contents:write.
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: stable

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: test-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: test-${{ runner.os }}-cargo-

      - name: Install Linux system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libdbus-1-dev

      - name: Run tests
        run: cargo test

  build:
    name: Build — ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-22.04
            asset: easy_harvest-linux-x86_64

          - name: Windows x86_64
            runner: windows-latest
            asset: easy_harvest-windows-x86_64.exe

          - name: macOS (Apple Silicon)
            runner: macos-latest
            asset: easy_harvest-macos-aarch64.zip

    # contents:write is scoped to this job only so only the upload step can
    # create/modify the release.  All other jobs stay read-only.
    permissions:
      contents: write

    steps:
      # Pin every action to a full commit SHA to prevent supply-chain attacks.
      # If a tag is later moved to malicious code the pinned SHA won't follow.
      # Renovate / Dependabot can keep these up to date automatically.

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: stable

      # Cache the Cargo registry to speed up dependency downloads.
      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # GTK 3 and D-Bus headers are required for the Linux tray icon.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libdbus-1-dev

      # ── Linux & Windows: plain cargo build ──────────────────────────────────
      - name: Build (Linux / Windows)
        if: runner.os != 'macOS'
        run: cargo build --release

      # ── macOS: use cargo-bundle to produce a proper .app ────────────────────
      # cargo-bundle calls cargo build internally, which runs build.rs and
      # generates the correctly-sized icons in target/icons/ before bundling.
      - name: Install cargo-bundle (macOS)
        if: runner.os == 'macOS'
        run: cargo install cargo-bundle --locked

      - name: Build & bundle (macOS)
        if: runner.os == 'macOS'
        run: cargo bundle --release

      # ── Strip to reduce binary size (not available / needed on Windows) ─────
      - name: Strip binary (Linux)
        if: runner.os == 'Linux'
        run: strip target/release/easy_harvest

      # ── Package ─────────────────────────────────────────────────────────────
      # No separate .sha256 sidecar is generated here — GitHub computes and
      # serves a `digest` field for every uploaded release asset, and the
      # in-app updater (src/update_installer.rs) reads that directly.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: cp target/release/easy_harvest ${{ matrix.asset }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item target\release\easy_harvest.exe ${{ matrix.asset }}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd "target/release/bundle/osx"
          zip -r "${{ github.workspace }}/${{ matrix.asset }}" "Easy Harvest.app"

      # ── Generate release notes ──────────────────────────────────────────────────
      - name: Generate release notes from commit log (Linux only)
        if: runner.os == 'Linux'
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            git log "$PREV_TAG"..HEAD --pretty='format:- %s'
          else
            git log --pretty='format:- %s'
          fi | { grep -vi '^- bump version$' || true; } > release-notes.md

      # ── Upload to the GitHub release created by the tag push ─────────────────
      - name: Upload to release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: ${{ matrix.asset }}
          # Tag suffix is the single source of truth: a tag containing '-'
          # (e.g. v1.6.0-beta.1) is published as a prerelease. This mirrors the
          # app's parse_semver, which ignores such tags, so CI and the in-app
          # update check stay in lock-step.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Only the Linux job sets the release body; the other two jobs just
          # upload their assets to the same release without overwriting it.
          body_path: ${{ runner.os == 'Linux' && 'release-notes.md' || '' }}
